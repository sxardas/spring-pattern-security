resolver 127.0.0.11 valid=10s ipv6=off;

# === healthcheck ===
server {
    listen 80 default_server;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}

# === keycloak: https://auth.develop.local ===
server {
    listen 443 ssl;
    http2 on;

    server_name auth.develop.local;

    ssl_certificate     /etc/nginx/certs/auth.develop.local.pem;
    ssl_certificate_key /etc/nginx/certs/auth.develop.local-key.pem;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        set $upstream http://keycloak:8080;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}

# === service-gateway: https://develop.local ===
server {
    listen 443 ssl;
    http2 on;

    server_name develop.local;

    ssl_certificate     /etc/nginx/certs/develop.local.pem;
    ssl_certificate_key /etc/nginx/certs/develop.local-key.pem;

    proxy_buffer_size 16k;
    proxy_buffers     4 32k;

    location / {
        set $upstream http://service-gateway:8080;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
