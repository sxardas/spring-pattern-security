name: stand-authorization-code-pkce

services:

  ### Nginx ###
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - net-authorization-code-pkce
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-pg:
        condition: service_healthy

  ### Keycloak & (Keycloak) Postgres ###
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: keycloak
    command: [ "start-dev", "--import-realm" ]
    environment:
      # bootstrap admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # database
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-pg:5432/${KC_POSTGRES_DATABASE}
      - KC_DB_USERNAME=${KC_POSTGRES_USERNAME}
      - KC_DB_PASSWORD=${KC_POSTGRES_PASSWORD}
      # public hostname
      - KC_HOSTNAME=https://auth.develop.local
      # http between nginx and keycloak & x-forwarded
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      # health & metrics
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    networks:
      - net-authorization-code-pkce
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      keycloak-pg:
        condition: service_healthy

  keycloak-pg:
    image: postgres:18-alpine
    container_name: keycloak-pg
    environment:
      - POSTGRES_DB=${KC_POSTGRES_DATABASE}
      - POSTGRES_USER=${KC_POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${KC_POSTGRES_PASSWORD}
    networks:
      - net-authorization-code-pkce
    volumes:
      - keycloak-pg-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${KC_POSTGRES_USERNAME} -d ${KC_POSTGRES_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ### Spring Boot ###
  service-spring:
    image: service-spring
    build:
      context: service-spring
    container_name: service-spring
    networks:
      - net-authorization-code-pkce
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health" ]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy

networks:
  net-authorization-code-pkce:
    driver: bridge

volumes:
  keycloak-pg-data:
