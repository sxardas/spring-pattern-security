### Keycloak ###
server {
    listen 443 ssl;
    server_name auth.develop.local;

    ssl_certificate     /etc/nginx/certs/auth.develop.local.pem;
    ssl_certificate_key /etc/nginx/certs/auth.develop.local-key.pem;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}

## Spring Boot ###
server {
    listen 443 ssl;
    server_name develop.local;

    ssl_certificate     /etc/nginx/certs/develop.local.pem;
    ssl_certificate_key /etc/nginx/certs/develop.local-key.pem;

    location /actuator {
        return 404;
    }

    location / {
        proxy_pass http://service-spring:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

}
